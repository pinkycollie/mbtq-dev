version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "pinkycollie"
    assignees:
      - "pinkycollie"
    labels:
      - "dependencies"
      - "npm"
    # Group all patch and minor updates together
    groups:
      development-dependencies:
        patterns:
          - "@types/*"
          - "@typescript-eslint/*"
          - "eslint*"
          - "vite*"
          - "vitest*"
        update-types:
          - "patch"
          - "minor"
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "@typescript-eslint/*"
          - "eslint*"
          - "vite*"
          - "vitest*"
        update-types:
          - "patch"
    # Security updates have higher priority
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "pinkycollie"
    assignees:
      - "pinkycollie"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

# Enable Beta features for Deno support
enable-beta-ecosystems: true

updates:
  # 1. Python (Core System)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-all:
        patterns: ["*"] # Grouping avoids PR spam

  # 2. NPM / AI SDK (High Velocity)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily" # AI SDKs move too fast for weekly
    labels:
      - "ai-sdk"
      - "automated"
    # Ensure AI SDKs are caught immediately
    versioning-strategy: increase

  # 3. NEW: Deno (For Edge/GCP Functions)
  - package-ecosystem: "deno"
    directory: "/"
    schedule:
      interval: "weekly"

  # 4. NEW: Docker (GCP Infrastructure)
  - package-ecosystem: "docker"
    directory: "/" 
    schedule:
      interval: "monthly" # Base images are more stable
    labels:
      - "infrastructure"

  # 5. GitHub Actions (CI/CD)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
