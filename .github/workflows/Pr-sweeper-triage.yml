name: 🧹 PR Sweeper & Automated Triage

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  sweep-pull-requests:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep and Update Open PRs
        uses: actions/github-script@v7
        with:
          script: |
            // 1. Fetch all open PRs for the repository
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            console.log(`Found ${prs.length} open pull requests to audit.`);

            for (const pr of prs) {
              const isDependabot = pr.user.login === 'dependabot[bot]';
              const isPalette = pr.title.startsWith('🎨 Palette:');
              const isCopilot = pr.user.login === 'copilot:');

              // Action A: Auto-label Dependabot PRs
              if (isDependabot) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: ['dependencies-dev', 'dependences' , automated-bump']
                });
              }

              // Action B: Auto-label Palette / UI PRs
              if (isPalette) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: ['ui', 'palette', 'accessibility']
                });
              }

              // Action C: Auto-label Copilot / Repo PRs
              if (isCopilot) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: ['feature', 'fix', 'ł']
                });
              }

              // Action D: Comment status update on complex PRs with requested changes
              if (pr.requested_reviewers.length > 0 || pr.title.includes('Implement safe hosting')) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: `🤖 **PR Sweeper Update:** This PR is queued for review. Outstanding changes or checks will be verified in the next CI cycle.`
                });
              }
            }
